<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Reator de Avogadro - Escape Room Digital</title>
    
    <!-- Tailwind CSS (Para Estilização) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Para compilar o JSX no navegador) - Versão 7.23.5 estável funciona com file:// -->
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

    <!-- Estilos e Animações Globais -->
    <style>
        body { margin: 0; padding: 0; background-color: #0a0a0a; color: #10b981; overflow-x: hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        
        @keyframes float { 
            0% { transform: translateY(0) translateX(0); } 
            50% { transform: translateY(-15px) translateX(8px); } 
            100% { transform: translateY(0) translateX(0); } 
        }
        .particle { animation: float 3s infinite ease-in-out; }
        
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-3px, 3px) }
            40% { transform: translate(-3px, -3px) }
            60% { transform: translate(3px, 3px) }
            80% { transform: translate(3px, -3px) }
            100% { transform: translate(0) }
        }
        .glitch-anim { animation: glitch 0.15s infinite; filter: hue-rotate(90deg) contrast(200%); }
        .glitch-anim-fast { animation: glitch 0.05s infinite; filter: hue-rotate(90deg) contrast(200%); opacity: 0.8; }
        
        @keyframes stripes { from { background-position: 0 0; } to { background-position: 1rem 0; } }
        
        @keyframes typeWriter { from { width: 0; } to { width: 100%; } }
        @keyframes blink { 50% { border-color: transparent; } }
        .typing-effect {
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid #10b981;
            animation: typeWriter 2s steps(40, end), blink 0.75s step-end infinite;
        }

        @keyframes shimmer { 100% { transform: translateX(100%); } }

        /* Estilos base scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #059669; }
    </style>
</head>
<body>
    <!-- A aplicação React será injetada aqui -->
    <div id="root"></div>

    <!-- Lógica do Jogo em React -->
    <script type="text/babel" data-type="module" data-presets="react">
        const { useState, useEffect, useRef } = React;

        // ============================================================================
        // SISTEMA DE ÍCONES
        // ============================================================================
        const Icons = {
            Alert: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
            Clock: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Power: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>,
            Scale: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>,
            Droplet: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>,
            Settings: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .11 1.89l1.8 2a4.8 4.8 0 0 1 0 6.53l-1.8 2a1.65 1.65 0 0 0-.11 1.89l1.4 2.6a4.8 4.8 0 0 1-2.9 6.29l-2.77.8a1.65 1.65 0 0 0-1.12 1.5l-.6 2.87a4.8 4.8 0 0 1-5.69 3.65l-2.83-.75a1.65 1.65 0 0 0-1.86.32l-2.15 2a4.8 4.8 0 0 1-6.8 0l-2.15-2a1.65 1.65 0 0 0-1.86-.32l-2.83.75a4.8 4.8 0 0 1-5.69-3.65l-.6-2.87a1.65 1.65 0 0 0-1.12-1.5l-2.77-.8a4.8 4.8 0 0 1-2.9-6.29l1.4-2.6a1.65 1.65 0 0 0 .11-1.89l-1.8-2a4.8 4.8 0 0 1 0-6.53l1.8-2a1.65 1.65 0 0 0 .11-1.89l-1.4-2.6a4.8 4.8 0 0 1 2.9-6.29l2.77-.8a1.65 1.65 0 0 0 1.12-1.5l.6-2.87a4.8 4.8 0 0 1 5.69-3.65l2.83.75a1.65 1.65 0 0 0 1.86-.32l2.15-2a4.8 4.8 0 0 1 6.8 0l2.15 2a1.65 1.65 0 0 0 1.86.32l2.83-.75a4.8 4.8 0 0 1 5.69 3.65l.6 2.87a1.65 1.65 0 0 0 1.12 1.5l2.77.8a4.8 4.8 0 0 1 2.9 6.29l-1.4 2.6z"/></svg>,
            Search: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
            Target: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
            Wind: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>,
            Hexagon: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>,
            Cube: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>,
            Shield: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
            Award: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-12 h-12"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
        };

        // ============================================================================
        // UTILITÁRIOS
        // ============================================================================
        const checkSciNotation = (mantissa, exponent, targetValue) => {
            const mVal = parseFloat(mantissa.replace(',', '.'));
            const eVal = parseInt(exponent);
            if (isNaN(mVal) || isNaN(eVal)) return false;
            const userVal = mVal * Math.pow(10, eVal);
            return Math.abs(userVal - targetValue) / targetValue < 0.015;
        };

        // Verifica notação científica contra múltiplos valores aceitáveis (com tolerância maior)
        const checkSciNotationMulti = (mantissa, exponent, acceptedValues, tolerance = 0.05) => {
            const mVal = parseFloat(mantissa.replace(',', '.'));
            const eVal = parseInt(exponent);
            if (isNaN(mVal) || isNaN(eVal)) return false;
            const userVal = mVal * Math.pow(10, eVal);
            if (!isFinite(userVal)) return false;
            return acceptedValues.some(target => 
                Math.abs(userVal - target) / target < tolerance
            );
        };

        const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        };

        // ============================================================================
        // TELAS DE ESTADO (Boot, Intro, Vitória, Derrota)
        // ============================================================================
        function ScreenBoot({ onComplete }) {
            const [lines, setLines] = useState([]);
            const bootSequence = [
                "Iniciando AVOGADRO-OS v9.4.2...",
                "Carregando módulos estequiométricos [OK]",
                "Verificando integridade das ligações covalentes [OK]",
                "ALERTA: Instabilidade detetada no Núcleo de Contenção.",
                "Aviso Crítico: Falha na refrigeração primária.",
                "Isolando área do laboratório... Portas trancadas.",
                "Iniciando protocolo de Recalibração Manual.",
                "Pressione ENTER para continuar ou aguarde..."
            ];

            useEffect(() => {
                let currentLine = 0;
                const interval = setInterval(() => {
                    if (currentLine < bootSequence.length) {
                        setLines(prev => [...prev, bootSequence[currentLine]]);
                        currentLine++;
                    } else {
                        clearInterval(interval);
                        // Auto-avança após 4 segundos se o usuário não pressionar nada
                        setTimeout(() => {
                            if (onComplete) onComplete();
                        }, 4000);
                    }
                }, 500);

                const handleKeyDown = (e) => {
                    if (e.key === 'Enter' && onComplete) {
                        clearInterval(interval);
                        onComplete();
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => {
                    clearInterval(interval);
                    window.removeEventListener('keydown', handleKeyDown);
                };
            }, [onComplete]);

            return (
                <div className="w-full h-full flex flex-col justify-end text-emerald-500 font-mono text-sm md:text-lg">
                    {lines.map((line, idx) => (
                        <div key={idx} className={idx >= 3 ? "text-red-500 font-bold" : "text-emerald-600"}>
                            {`> ${line}`}
                        </div>
                    ))}
                    <div className="typing-effect mt-4 text-emerald-400 font-bold">_</div>
                </div>
            );
        }

        function ScreenIntro({ onStart }) {
            return (
                <div className="text-center space-y-8 animate-in zoom-in duration-700 h-full flex flex-col justify-center items-center">
                    <div className="relative">
                        <div className="absolute inset-0 bg-red-600 rounded-full blur-[40px] opacity-30 animate-pulse"></div>
                        <div className="relative bg-neutral-900 border-2 border-red-500/50 p-6 rounded-2xl">
                            <Icons.Shield />
                        </div>
                    </div>
                    
                    <h2 className="text-4xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-b from-red-400 to-red-700 uppercase tracking-widest drop-shadow-sm">
                        Colapso Iminente
                    </h2>
                    
                    <div className="text-neutral-300 text-lg md:text-xl max-w-3xl mx-auto space-y-4 text-left border-l-4 border-red-500 pl-6 bg-red-950/10 p-6 rounded-r-lg shadow-inner">
                        <p>O sistema termodinâmico do <strong className="text-red-400">Reator Principal</strong> falhou devido a um erro de cálculo estequiométrico.</p>
                        <p>Para estabilizar o núcleo, a equipa de contenção precisa recalibrar <strong className="text-emerald-400">15 Módulos Interativos</strong> consecutivamente.</p>
                        <p className="text-amber-500 font-bold bg-amber-950/30 p-2 inline-block rounded">O nível de radiação será letal em exatamente 25 minutos.</p>
                    </div>
                    
                    <button 
                        onClick={onStart} 
                        className="group relative mt-12 overflow-hidden rounded-full bg-red-600 px-12 py-5 font-black uppercase text-white tracking-widest shadow-[0_0_40px_rgba(220,38,38,0.5)] transition-all hover:scale-105 active:scale-95"
                    >
                        <div className="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full hover:animate-[shimmer_1.5s_infinite]"></div>
                        <span className="relative">Iniciar Recalibração do Núcleo</span>
                    </button>
                </div>
            );
        }

        function ScreenVictory({ timeLeft, penalties, onRestart }) {
            let rank = 'C';
            let color = 'text-amber-500';
            let message = "Sobreviveu, mas por pouco.";

            if (timeLeft > 15 * 60 && penalties === 0) { rank = 'S'; color = 'text-fuchsia-500'; message = "Genialidade Estequiométrica Pura!"; }
            else if (timeLeft > 10 * 60 && penalties <= 1) { rank = 'A'; color = 'text-emerald-400'; message = "Excelente Trabalho de Equipa!"; }
            else if (timeLeft > 5 * 60 && penalties <= 3) { rank = 'B'; color = 'text-blue-400'; message = "Sólido, mas com alguns percalços."; }

            return (
                <div className="text-center space-y-8 animate-in slide-in-from-bottom-10 duration-700 h-full flex flex-col justify-center items-center">
                    <div className="relative">
                        <div className="absolute inset-0 bg-emerald-500 rounded-full blur-[50px] opacity-40"></div>
                        <div className="relative bg-black border-4 border-emerald-500 p-8 rounded-full shadow-[0_0_50px_rgba(16,185,129,0.8)] text-emerald-400">
                            <Icons.Award />
                        </div>
                    </div>
                    
                    <h2 className="text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-b from-emerald-300 to-emerald-600 uppercase tracking-widest">
                        Sistema Estabilizado
                    </h2>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-4xl mt-8">
                        <div className="bg-neutral-900 border border-neutral-700 p-6 rounded-2xl flex flex-col items-center shadow-lg">
                            <span className="text-neutral-500 uppercase font-bold tracking-widest text-xs mb-2">Tempo Restante</span>
                            <span className="text-4xl font-black text-white font-mono">{formatTime(timeLeft)}</span>
                        </div>
                        <div className="bg-neutral-900 border border-neutral-700 p-6 rounded-2xl flex flex-col items-center shadow-lg relative overflow-hidden">
                            <div className={`absolute inset-0 opacity-20 ${rank==='S'?'bg-fuchsia-500':rank==='A'?'bg-emerald-500':rank==='B'?'bg-blue-500':'bg-amber-500'}`}></div>
                            <span className="text-neutral-500 uppercase font-bold tracking-widest text-xs mb-2 relative z-10">Ranking Final</span>
                            <span className={`text-6xl font-black font-serif relative z-10 ${color} drop-shadow-lg`}>{rank}</span>
                        </div>
                        <div className="bg-neutral-900 border border-neutral-700 p-6 rounded-2xl flex flex-col items-center shadow-lg">
                            <span className="text-neutral-500 uppercase font-bold tracking-widest text-xs mb-2">Dicas Usadas</span>
                            <span className="text-4xl font-black text-amber-400 font-mono">{penalties}</span>
                        </div>
                    </div>

                    <p className="text-xl font-bold text-neutral-300 italic">"{message}"</p>

                    <button onClick={onRestart} className="mt-8 border-2 border-emerald-600 text-emerald-500 hover:bg-emerald-900/40 hover:text-emerald-300 font-black py-4 px-12 rounded-full uppercase tracking-widest transition-all">
                        Voltar ao Ecrã Principal
                    </button>
                </div>
            );
        }

        function ScreenGameOver({ onRestart }) {
            return (
                <div className="text-center space-y-8 animate-in fade-in duration-1000 h-full flex flex-col justify-center items-center">
                    <div className="bg-red-950 p-8 rounded-full border-4 border-red-600 text-red-500 shadow-[0_0_80px_rgba(220,38,38,0.8)] animate-pulse">
                        <Icons.Alert />
                    </div>
                    <div className="space-y-2">
                        <h2 className="text-6xl md:text-8xl font-black text-red-600 uppercase tracking-widest drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)]">
                            FALHA CRÍTICA
                        </h2>
                        <h3 className="text-2xl text-red-400 font-bold tracking-widest uppercase">
                            Nível de Radiação Letal Atingido.
                        </h3>
                    </div>
                    <p className="text-neutral-500 text-lg max-w-lg">O laboratório foi selado permanentemente. A simulação foi encerrada para proteger os sistemas externos.</p>
                    <button onClick={onRestart} className="mt-12 bg-red-900/50 border border-red-500 hover:bg-red-800 text-red-100 font-black py-4 px-10 rounded-lg uppercase tracking-widest transition-all">
                        Reiniciar Simulação
                    </button>
                </div>
            );
        }

        function ModuleHeader({ phase, title, icon, instruction }) {
            return (
                <div className="w-full mb-8">
                    <div className="flex justify-between items-end border-b border-emerald-800/60 pb-4">
                        <div className="flex items-center gap-4">
                            <div className="bg-emerald-950/50 border border-emerald-800 p-3 rounded-xl shadow-inner text-emerald-400">
                                {icon}
                            </div>
                            <div>
                                <span className="text-xs font-bold text-neutral-500 uppercase tracking-widest block mb-1">Módulo Operacional {phase}</span>
                                <h3 className="text-2xl md:text-3xl font-black text-white tracking-wide">{title}</h3>
                            </div>
                        </div>
                    </div>
                    {instruction && (
                        <div className="mt-4 bg-neutral-950/50 border-l-4 border-emerald-600 p-4 rounded-r-lg">
                            <p className="text-neutral-300 text-sm md:text-base leading-relaxed">{instruction}</p>
                        </div>
                    )}
                </div>
            );
        }

        // ============================================================================
        // MÓDULOS 1 A 15
        // ============================================================================

        function Module1({ onComplete }) {
            const elements = [
                { symbol: 'Ca', mass: 40, color: 'bg-zinc-200 text-zinc-900 border-zinc-400' },
                { symbol: 'C', mass: 12, color: 'bg-stone-800 text-stone-100 border-stone-600' },
                { symbol: 'O', mass: 16, color: 'bg-sky-200 text-sky-900 border-sky-400' },
                { symbol: 'H', mass: 1, color: 'bg-white text-black border-neutral-300' },
                { symbol: 'Na', mass: 23, color: 'bg-amber-300 text-amber-900 border-amber-500' }
            ];
            
            const [scaleItems, setScaleItems] = useState([]);
            const [inputMass, setInputMass] = useState('');
            const currentMass = scaleItems.reduce((sum, item) => sum + item.mass, 0);
            const targetMass = 100; // CaCO3

            const handleDragStart = (e, el) => e.dataTransfer.setData('element', JSON.stringify(el));
            const handleDrop = (e) => { e.preventDefault(); const elData = e.dataTransfer.getData('element'); if(elData) setScaleItems([...scaleItems, JSON.parse(elData)]); };
            
            return (
                <div className="h-full flex flex-col">
                    <ModuleHeader phase={1} title="Calibrador de Massa Analítica" icon={<Icons.Scale />} instruction="O sistema requer exatamente Carbonato de Cálcio (CaCO₃) puro. Arraste os blocos químicos para a bandeja da balança e indique a massa molar resultante." />
                    <div className="flex-1 grid md:grid-cols-2 gap-8 items-start mt-4">
                        <div className="bg-black/40 p-6 rounded-2xl border border-neutral-800 shadow-inner">
                            <p className="text-xs text-neutral-500 font-bold uppercase mb-4 tracking-widest">Matéria Prima Disponível</p>
                            <div className="flex flex-wrap gap-4">
                                {elements.map((el) => (
                                    <div key={el.symbol} draggable onDragStart={(e) => handleDragStart(e, el)} onClick={() => setScaleItems([...scaleItems, el])} className={`w-20 h-24 ${el.color} rounded-xl flex flex-col items-center justify-center cursor-pointer shadow-lg hover:-translate-y-2 active:scale-95 border-b-4 hover:brightness-110 transition-all`}>
                                        <span className="font-black text-3xl">{el.symbol}</span><span className="text-xs font-bold opacity-80 mt-1">{el.mass} u</span>
                                    </div>
                                ))}
                            </div>
                            <button onClick={() => {setScaleItems([]); setInputMass('');}} className="mt-8 w-full py-3 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 rounded-lg font-bold uppercase text-xs tracking-widest transition-colors">Limpar Bandeja</button>
                        </div>
                        <div className="flex flex-col items-center justify-center w-full">
                            <div onDrop={handleDrop} onDragOver={e=>e.preventDefault()} className={`w-full max-w-sm h-64 border-2 border-dashed rounded-3xl flex flex-col items-center justify-end p-4 transition-colors relative ${currentMass === targetMass ? 'border-emerald-500 bg-emerald-950/20' : 'border-neutral-600 bg-black/40 hover:border-emerald-500/50'}`}>
                                {scaleItems.length === 0 && <span className="absolute inset-0 flex items-center justify-center text-neutral-600 font-bold uppercase tracking-widest pointer-events-none">Área de Síntese</span>}
                                <div className="absolute top-4 flex flex-wrap-reverse justify-center content-end gap-2 w-full px-4 h-32 overflow-hidden">
                                    {scaleItems.map((item, i) => <div key={i} className={`w-10 h-12 ${item.color} rounded border-b-2 text-xs font-bold flex items-center justify-center shadow-md animate-in slide-in-from-top-4`}>{item.symbol}</div>)}
                                </div>
                                <div className="w-full bg-neutral-900 border border-neutral-700 p-4 text-center rounded-xl flex flex-col items-center gap-3 shadow-[0_5px_15px_rgba(0,0,0,0.5)] z-10">
                                    <span className="text-neutral-500 text-[10px] uppercase font-black tracking-widest">Informar Massa (g/mol)</span>
                                    <div className="flex items-center gap-2">
                                        <input type="number" value={inputMass} onChange={(e) => setInputMass(e.target.value)} placeholder="000" className={`w-32 bg-black border-2 text-center text-3xl font-mono font-black py-2 rounded focus:outline-none transition-colors ${currentMass === targetMass && inputMass === targetMass.toString() ? 'border-emerald-500 text-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.3)]' : 'border-neutral-700 text-white'}`} />
                                    </div>
                                </div>
                            </div>
                            <button onClick={onComplete} disabled={currentMass !== targetMass || inputMass !== targetMass.toString()} className={`mt-8 w-full max-w-sm py-4 rounded-xl font-black uppercase tracking-widest transition-all duration-300 ${currentMass === targetMass && inputMass === targetMass.toString() ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-[0_0_30px_rgba(16,185,129,0.4)] scale-105' : 'bg-neutral-900 border border-neutral-800 text-neutral-600 cursor-not-allowed'}`}>Sintetizar & Injetar</button>
                        </div>
                    </div>
                </div>

        function Module2({ onComplete }) {
            const [valveVal, setValveVal] = useState(0);
            const [errorFeedback, setErrorFeedback] = useState(false);
            const targetMol = 2.7; // 430.65g de CuSO4 (159.5 g/mol)

                if (valveVal === targetMol) onComplete();

            return (
                <div className="h-full flex flex-col">
                    <ModuleHeader phase={2} title="Válvula de Pressão Estequiométrica" icon={<Icons.Droplet />} instruction="Calcule a equivalência em quantidade de matéria (mols) da massa detetada e ajuste a válvula rotativa." />

                                <p className="text-neutral-400 text-xs mt-3 bg-neutral-900 inline-block px-3 py-1 rounded-full">MM Referência: 159,5 g/mol</p>
                            </div>
                            <div className="flex flex-col items-center">
                                <div className="relative w-40 h-40 mb-8 cursor-ew-resize">
                                    <svg viewBox="0 0 100 100" className="w-full h-full text-blue-500 drop-shadow-[0_0_20px_rgba(59,130,246,0.3)]" style={{ transform: `rotate(${valveVal * 72}deg)`, transition: 'transform 0.1s linear' }}>

                                <div className="text-center mt-6 w-full">
                                    <div className="bg-black py-3 rounded-xl border border-neutral-800 shadow-inner">
                                        <span className="text-5xl font-mono font-black text-white">{valveVal.toFixed(1)}</span>
                                        <span className="text-xl text-neutral-500 ml-2 font-bold uppercase tracking-widest">mol</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div className="w-24 md:w-32 h-64 md:h-96 border-[6px] border-t-0 border-neutral-800 bg-black rounded-b-3xl relative overflow-hidden flex flex-col justify-end shadow-[0_20px_50px_rgba(0,0,0,0.8)]">

                    </div>
                    <div className="text-center mt-10">
                        <button onClick={handleLock} className="px-16 py-5 rounded-full font-black uppercase tracking-widest transition-all bg-neutral-900 text-white border border-neutral-700 hover:bg-blue-600 hover:border-blue-400 hover:shadow-[0_0_30px_rgba(59,130,246,0.6)] active:scale-95">Travar Válvula de Injeção</button>
                    </div>
                </div>
            );
        }

        function Module3({ onComplete }) {
            const [mantissa, setMantissa] = useState('');
            const [expoente, setExpoente] = useState('');
            const targetParticles = 0.35 * 6.022e23; 
            const isCorrect = checkSciNotation(mantissa, expoente, targetParticles);
            const particleCount = Math.min(Math.max((parseInt(expoente) || 0) * 3, 0), 150); 

            return (
                <div className="h-full flex flex-col">
                    <ModuleHeader phase={3} title="Amplificador Quântico de Partículas" icon={<Icons.Settings />} instruction="Para selar a câmara de vácuo, introduza o número total exato de moléculas (Notação Científica) presentes em 0,35 mols." />
                    <div className="flex-1 flex flex-col md:flex-row gap-8 mt-4 items-center">
                        <div className="bg-black/60 p-8 rounded-3xl border border-neutral-800 flex-1 w-full max-w-md shadow-2xl relative">

                            <div className="mb-8">
                                <span className="text-[10px] text-neutral-500 font-bold uppercase tracking-widest block mb-1">Leitura Quântica Atual</span>
                                <p className="text-2xl font-black text-white bg-neutral-900 border border-neutral-800 p-4 rounded-xl">0,35 mols <span className="text-emerald-500">O₂</span></p>
                            </div>
                            <div className="bg-emerald-950/20 border border-emerald-900/50 p-6 rounded-2xl mb-8">

                                    <div className="flex flex-col -mt-12">

                            <button onClick={onComplete} disabled={!isCorrect} className={`w-full py-4 rounded-xl font-black uppercase tracking-widest transition-all duration-500 ${isCorrect ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-[0_0_30px_rgba(16,185,129,0.5)]' : 'bg-neutral-900 border border-neutral-800 text-neutral-600 cursor-not-allowed'}`}>Selar Câmara Quântica</button>

                                return <div key={i} className="absolute rounded-full bg-emerald-400 particle" style={{ width: size, height: size, top: `${Math.random()*100}%`, left: `${Math.random()*100}%`, animationDuration: `${Math.random()*4+2}s`, animationDelay: `${Math.random()*2}s`, boxShadow: `0 0 ${size*2}px rgba(52,211,153,0.8)` }} />

                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function Module4({ onComplete }) {
            const [h2, setH2] = useState(0);
            const [o2, setO2] = useState(0);

            const h2oProduced = Math.min(h2, o2 * 2);
            const h2Used = h2oProduced;
            const o2Used = h2oProduced / 2;
            const excessH2 = h2 - h2Used;
            const excessO2 = o2 - o2Used;

            const isTarget = h2oProduced === 4;
            const isPerfect = isTarget && excessH2 === 0 && excessO2 === 0;

            let reactorStatus = "A aguardar injeção de reagentes...";
            let statusColor = "text-neutral-500 border-neutral-800";
            
            if (h2 === 0 && o2 === 0) { reactorStatus = "Válvulas em modo de espera."; }
            else if (h2oProduced === 0) { reactorStatus = "Aviso: Falta um dos reagentes para iniciar a síntese química."; statusColor = "text-amber-500 border-amber-900"; }
            else if (excessH2 > 0 && excessO2 === 0) { reactorStatus = `Falha Crítica: O₂ é o REAGENTE LIMITANTE. Desperdício de ${excessH2} mol de H₂.`; statusColor = "text-red-500 border-red-900 bg-red-950/20"; }
            else if (excessO2 > 0 && excessH2 === 0) { reactorStatus = `Falha Crítica: H₂ é o REAGENTE LIMITANTE. Desperdício de ${excessO2} mol de O₂.`; statusColor = "text-red-500 border-red-900 bg-red-950/20"; }
            else if (h2oProduced > 0 && excessH2 === 0 && excessO2 === 0) {
                if (isTarget) { reactorStatus = "SÍNTESE PERFEITA! Alvo atingido sem desperdício de massa."; statusColor = "text-emerald-400 border-emerald-500 bg-emerald-950/20 font-bold shadow-[0_0_15px_rgba(16,185,129,0.2)]"; }
                else { reactorStatus = "Proporção estequiométrica correta, mas a massa de H₂O gerada não é a solicitada."; statusColor = "text-blue-400 border-blue-900"; }
            }

            return (
                <div className="h-full flex flex-col">
                    <ModuleHeader phase={4} title="Decodificador Estequiométrico" icon={<Icons.Settings />} instruction="Ajuste o fluxo de mols para sintetizar exatamente 4 Mols de Água (H₂O). Evite reagentes em excesso." />
                    <div className="flex-1 flex flex-col items-center mt-2">
                        <div className="mb-6 bg-black border border-neutral-800 py-3 px-8 rounded-xl shadow-inner text-center">
                            <span className="text-neutral-500 text-xs font-bold uppercase tracking-widest block mb-1">Equação Balanceada do Reator:</span>
                            <span className="text-white font-mono font-black text-xl tracking-widest">2 H₂ + 1 O₂ <span className="text-emerald-500 mx-3">➔</span> 2 H₂O</span>
                        </div>
                        <div className={`w-full max-w-4xl border-l-4 rounded-r-lg p-5 mb-8 transition-colors duration-300 ${statusColor} bg-neutral-900/50`}>
                            <p className="text-[10px] uppercase tracking-widest font-black opacity-70 mb-1">Diagnóstico em Tempo Real</p>
                            <p className="text-sm md:text-lg">{reactorStatus}</p>
                        </div>
                        <div className="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-12 items-center">
                            <div className="col-span-1 space-y-4">
                                <div className={`p-5 rounded-2xl border-2 transition-colors duration-300 relative overflow-hidden ${excessH2 > 0 ? 'bg-red-950/20 border-red-900/50' : 'bg-black/60 border-neutral-800'}`}>
                                    {excessH2 > 0 && <div className="absolute top-0 left-0 w-full h-1 bg-red-500 animate-pulse"></div>}
                                    <div className="flex justify-between items-center mb-4"><span className="text-sky-400 font-black text-2xl">H₂</span><span className="text-neutral-600 text-[10px] uppercase font-bold tracking-widest">Gás Entrada</span></div>
                                    <div className="flex items-center justify-between bg-neutral-900 p-2 rounded-xl border border-neutral-700 shadow-inner">
                                        <button onClick={() => setH2(Math.max(0, h2 - 1))} className="w-10 h-10 bg-neutral-800 hover:bg-neutral-600 rounded-lg text-white font-bold text-2xl transition-colors">-</button>
                                        <span className="text-3xl font-mono font-black text-white w-12 text-center">{h2}</span>
                                        <button onClick={() => setH2(h2 + 1)} className="w-10 h-10 bg-neutral-800 hover:bg-neutral-600 rounded-lg text-white font-bold text-2xl transition-colors">+</button>
                                    </div>
                                    <div className="text-xs font-mono font-bold flex justify-between mt-3 px-1">
                                        <span className="text-neutral-500">CONSUMIDO: <span className="text-white">{h2Used}</span></span>
                                        {excessH2 > 0 && <span className="text-red-500 animate-pulse bg-red-950 px-2 py-0.5 rounded">EXCESSO: {excessH2}</span>}
                                    </div>
                                </div>
                                <div className={`p-5 rounded-2xl border-2 transition-colors duration-300 relative overflow-hidden ${excessO2 > 0 ? 'bg-red-950/20 border-red-900/50' : 'bg-black/60 border-neutral-800'}`}>
                                    {excessO2 > 0 && <div className="absolute top-0 left-0 w-full h-1 bg-red-500 animate-pulse"></div>}
                                    <div className="flex justify-between items-center mb-4"><span className="text-amber-400 font-black text-2xl">O₂</span><span className="text-neutral-600 text-[10px] uppercase font-bold tracking-widest">Gás Entrada</span></div>
                                    <div className="flex items-center justify-between bg-neutral-900 p-2 rounded-xl border border-neutral-700 shadow-inner">
                                        <button onClick={() => setO2(Math.max(0, o2 - 1))} className="w-10 h-10 bg-neutral-800 hover:bg-neutral-600 rounded-lg text-white font-bold text-2xl transition-colors">-</button>
                                        <span className="text-3xl font-mono font-black text-white w-12 text-center">{o2}</span>
                                        <button onClick={() => setO2(o2 + 1)} className="w-10 h-10 bg-neutral-800 hover:bg-neutral-600 rounded-lg text-white font-bold text-2xl transition-colors">+</button>
                                    </div>
                                    <div className="text-xs font-mono font-bold flex justify-between mt-3 px-1">
                                        <span className="text-neutral-500">CONSUMIDO: <span className="text-white">{o2Used}</span></span>
                                        {excessO2 > 0 && <span className="text-red-500 animate-pulse bg-red-950 px-2 py-0.5 rounded">EXCESSO: {excessO2}</span>}
                                    </div>
                                </div>
                            </div>
                            <div className="hidden md:flex col-span-1 justify-center relative">
                                <div className={`w-full h-1 absolute top-1/2 -translate-y-1/2 -z-10 ${h2oProduced > 0 ? 'bg-gradient-to-r from-neutral-800 to-emerald-500' : 'bg-neutral-800'}`}></div>
                                <div className={`p-4 rounded-full border-4 bg-black ${h2oProduced > 0 ? 'border-emerald-500 text-emerald-500 shadow-[0_0_20px_rgba(16,185,129,0.4)]' : 'border-neutral-800 text-neutral-700'}`}>
                                    <Icons.Settings />
                                </div>
                            </div>
                            <div className="col-span-1 h-full">
                                <div className={`p-8 rounded-3xl border-2 h-full flex flex-col justify-center items-center transition-all duration-500 relative overflow-hidden ${isTarget && isPerfect ? 'bg-emerald-950/20 border-emerald-500 shadow-[inset_0_0_50px_rgba(16,185,129,0.1)]' : 'bg-black/60 border-neutral-800'}`}>
                                    <span className="text-neutral-500 text-[10px] uppercase font-black tracking-widest mb-6">Tanque de Produto Final</span>
                                    <span className="text-4xl font-black text-white mb-2 drop-shadow-md">H₂O</span>
                                    <div className="bg-neutral-900 border border-neutral-700 w-full py-6 rounded-2xl flex flex-col items-center justify-center shadow-inner mt-4">
                                        <span className={`text-7xl font-mono font-black ${isTarget && isPerfect ? 'text-emerald-400 drop-shadow-[0_0_10px_rgba(16,185,129,0.8)]' : 'text-neutral-500'}`}>{h2oProduced}</span>
                                        <span className="text-neutral-600 font-bold uppercase tracking-widest mt-2 text-xs">Mols Gerados</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button onClick={onComplete} disabled={!isPerfect} className={`mt-12 px-16 py-5 rounded-full font-black uppercase tracking-widest transition-all duration-300 ${isPerfect ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-[0_0_40px_rgba(16,185,129,0.6)] scale-105' : 'bg-neutral-900 border border-neutral-800 text-neutral-600 cursor-not-allowed'}`}>Confirmar Síntese de Água</button>
                    </div>
                </div>
            );
        }

        function Module5({ onComplete }) {
            const [v1, setV1] = useState(''); const [v2, setV2] = useState('');
            const [v3, setV3] = useState(''); const [v4, setV4] = useState('');

            const c1 = Math.abs(parseFloat(v1.replace(',', '.')) - 1.5) < 0.05; 
            const c2 = Math.abs(parseFloat(v2.replace(',', '.')) - 3.36) < 0.1; 
            const c3 = v3.trim() === '44'; 
            const c4 = Math.abs(parseFloat(v4.replace(',', '.')) - 2.71) < 0.05; 

            const allCorrect = c1 && c2 && c3 && c4;

            return (
                <div className="h-full flex flex-col">
                    <ModuleHeader phase={5} title="Override de Segurança" icon={<Icons.Alert />} instruction="O painel de energia desarmou. Quebre a encriptação dos 4 terminais simultaneamente." />
                    <div className="flex-1 flex flex-col mt-4">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto w-full">
                            {[
                                { c: c1, v: v1, setV: setV1, id: "0x1A", q: "27g de Água (H₂O) = ___ mols?", ph: "Mols" }, 
                                { c: c2, v: v2, setV: setV2, id: "0x2B", q: "0,28 mol de Carbono (C) = ___ g?", ph: "Gramas" }, 
                                { c: c3, v: v3, setV: setV3, id: "0x3C", q: "Massa Molar de CO₂ = ___ g/mol?", ph: "g/mol" }, 
                                { c: c4, v: v4, setV: setV4, id: "0x4D", q: "Átomos em 0,45 mol He? (___ × 10²³)", ph: "Mantissa" }
                            ].map(({ c, v, setV, id, q, ph }, i) => (
                                <div key={i} className={`p-6 rounded-2xl border-l-4 transition-all duration-500 relative overflow-hidden ${c ? 'bg-emerald-950/20 border-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.1)]' : 'bg-black/80 border-amber-500 hover:border-amber-400'}`}>
                                    {c && <div className="absolute top-0 right-0 bg-emerald-500 text-black text-[10px] font-black px-2 py-1 rounded-bl-lg uppercase tracking-widest">Bypass OK</div>}
                                    <div className="flex items-center gap-3 mb-4">
                                        <span className={`w-2 h-2 rounded-full animate-pulse ${c ? 'bg-emerald-500' : 'bg-amber-500'}`}></span>
                                        <span className="text-[10px] text-neutral-500 font-mono tracking-widest uppercase">Terminal {id}</span>
                                    </div>
                                    <p className="text-white text-sm font-bold mb-5 h-10">{q}</p>
                                    <div className="flex items-center gap-3">
                                        <div className="flex-1 bg-neutral-900 p-1 rounded-lg border border-neutral-700">
                                            <input type="text" value={v} onChange={(e) => setV(e.target.value)} disabled={c} placeholder={ph} className={`w-full bg-transparent text-center font-mono text-xl py-2 focus:outline-none transition-colors ${c ? 'text-emerald-400 font-black' : 'text-amber-400 focus:text-amber-300'}`} />
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="mt-12 flex justify-center items-center h-24">
                            {allCorrect ? (
                                <button onClick={onComplete} className="w-full max-w-lg bg-emerald-600 text-white font-black text-2xl py-6 rounded-2xl uppercase tracking-widest shadow-[0_0_40px_rgba(16,185,129,0.6)] animate-pulse border-2 border-emerald-400 hover:scale-105 transition-transform">
                                    Restabelecer Energia
                                </button>
                            ) : (
                                <div className="flex flex-col items-center gap-2 opacity-50">
                                    <Icons.Power />
                                    <span className="font-bold uppercase tracking-widest text-sm text-neutral-500">Sistemas Trancados</span>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function Module6({ onComplete }) {
            const [selectedEl, setSelectedEl] = useState(null);
            const [inputMass, setInputMass] = useState('');
            
            const period3 = [
                { s: 'Na', n: 'Sódio', m: 23, g: 'Alcalino' }, 
                { s: 'Mg', n: 'Magnésio', m: 24.3, g: 'Alcalino-Terroso' }, 
                { s: 'Al', n: 'Alumínio', m: 27, g: 'Metal' }, 
                { s: 'Si', n: 'Silício', m: 28, g: 'Semimetal' }, 
                { s: 'P', n: 'Fósforo', m: 31, g: 'Não-Metal' }, 
                { s: 'S', n: 'Enxofre', m: 32, g: 'Não-Metal' }, 
                { s: 'Cl', n: 'Cloro', m: 35.5, g: 'Halogénio' }, 
                { s: 'Ar', n: 'Árgon', m: 40, g: 'Gás Nobre' }
            ];

            const isCorrect = inputMass.replace(',', '.') === '60.75' && selectedEl?.s === 'Mg';

            return (
                <div className="h-full flex flex-col">
                    <ModuleHeader phase={6} title="Scanner Espectral Periódico" icon={<Icons.Search />} instruction="Localize o metal alcalino-terroso do 3º período e calcule a massa necessária para injetar exatamente 2,5 mols no núcleo." />
                    <div className="flex-1 flex flex-col items-center mt-4">
                        <div className="w-full max-w-4xl bg-black/60 p-6 rounded-2xl border border-neutral-800 shadow-inner mb-8 overflow-x-auto">
                            <p className="text-[10px] text-neutral-500 uppercase tracking-widest font-bold mb-4">Fragmento Recuperado: 3º Período</p>
                            <div className="flex gap-3 justify-center min-w-max">
                                {period3.map(el => (

            const lockBalloon = (id) => {

                setBalloons(prev => prev.map(b => {

     function Module11({ onComplete }) {
            // Definição da molécula 3D: 2,3-dimetilbutano (C6H14)
            const atoms3D = useRef([

                { id: 'h14', t: 'H', m: 1, x: 20, y: 40, z: -60 },

            const bonds = useRef([

            const projectedAtoms = atoms3D.map(a => {

                const sinY = Math.sin(angle);
                
                // Rotação Y
                let x = a.x * cosY - a.z * sinY;
                let z = a.x * sinY + a.z * cosY;
                let y = a.y;

                // Rotação X estática (Tilt para ver de cima)
                const tilt = 0.3;
                const cosX = Math.cos(tilt);
                const sinX = Math.sin(tilt);
                const finalY = y * cosX - z * sinX;
                const finalZ = y * sinX + z * cosX;

                // Perspectiva
                const perspective = 300;
                const scale = perspective / (perspective + finalZ);

                return { ...a, px: x * scale + 150, py: finalY * scale + 100, pz: finalZ, scale };
            });

                                    return (

                                        />
                                    );
                                })}

                                {/* Átomos renderizados por profundidade (Painter's Algorithm) */}
                                {[...projectedAtoms].sort((a,b) => b.pz - a.pz).map(a => {
                                    const isScanned = scanned.includes(a.id);

                                    // Cores baseadas no tipo de átomo e status de scan

            const [atoms, setAtoms] = useState([
                { id: 'c1', t: 'C', c: 'fill-stone-800 stroke-stone-600', m: 12, x: 50, y: 100, ok: false },
                { id: 'c2', t: 'C', c: 'fill-stone-800 stroke-stone-600', m: 12, x: 100, y: 100, ok: false },
                { id: 'o', t: 'O', c: 'fill-red-600 stroke-red-400', m: 16, x: 150, y: 100, ok: false },
                { id: 'h1', t: 'H', c: 'fill-neutral-200 stroke-white', m: 1, x: 50, y: 50, ok: false },
                { id: 'h2', t: 'H', c: 'fill-neutral-200 stroke-white', m: 1, x: 50, y: 150, ok: false },
                { id: 'h3', t: 'H', c: 'fill-neutral-200 stroke-white', m: 1, x: 10, y: 100, ok: false },
                { id: 'h4', t: 'H', c: 'fill-neutral-200 stroke-white', m: 1, x: 100, y: 50, ok: false },
                { id: 'h5', t: 'H', c: 'fill-neutral-200 stroke-white', m: 1, x: 100, y: 150, ok: false },
                { id: 'h6', t: 'H', c: 'fill-neutral-200 stroke-white', m: 1, x: 180, y: 100, ok: false }
            ]);
            
            const [activeAtom, setActiveAtom] = useState(null);
            const [ans, setAns] = useState('');
            
            const isFilled = atoms.every(a => a.ok);
            const isFinalOk = ans === '3'; // 138 / 46 = 3

            const handleInput = (val) => {
                if (!activeAtom) return;
                const atom = atoms.find(a => a.id === activeAtom);
                if (parseInt(val) === atom.m) setAtoms(atoms.map(a => a.id === activeAtom ? { ...a, ok: true } : a));
                setActiveAtom(null);
            };

            return (
                <div className="h-full flex flex-col">
                    <ModuleHeader phase={15} title="O Cofre Orgânico Final" icon={<Icons.Shield />} instruction="Esta é a barreira final de segurança primária. Estrutura alvo: Etanol (C₂H₆O). Descodifique cada secção da molécula rapidamente introduzindo a massa atómica. Depois resolva a divisão de purga." />
                    <div className="flex-1 flex flex-col items-center mt-2">
                        <div className="w-full max-w-3xl h-[300px] md:h-[400px] bg-gradient-to-tr from-neutral-900 to-black border-[8px] border-neutral-800 rounded-[40px] relative overflow-hidden mb-8 shadow-2xl flex items-center justify-center perspective-1000">
                            <svg viewBox="0 0 200 200" className={`w-full h-full transition-transform duration-[2000ms] ease-in-out drop-shadow-2xl ${isFilled ? 'rotate-[360deg] scale-105' : ''}`}>
                                <g stroke="#444" strokeWidth="8" strokeLinecap="round">
                                    <line x1="50" y1="100" x2="100" y2="100" />
                                    <line x1="100" y1="100" x2="150" y2="100" />
                                    <line x1="50" y1="100" x2="50" y2="50" />
                                    <line x1="50" y1="100" x2="50" y2="150" />
                                    <line x1="50" y1="100" x2="10" y2="100" />
                                    <line x1="100" y1="100" x2="100" y2="50" />
                                    <line x1="100" y1="100" x2="100" y2="150" />
                                    <line x1="150" y1="100" x2="180" y2="100" />
                                </g>
                                {atoms.map(a => (
                                    <circle 
                                        key={a.id} cx={a.x} cy={a.y} r={a.t === 'H' ? 12 : 22} 
                                        className={`${a.c} cursor-pointer transition-all duration-500 stroke-4 ${a.ok ? 'filter drop-shadow-[0_0_15px_rgba(16,185,129,0.8)] fill-emerald-500 stroke-emerald-300' : 'hover:stroke-white stroke-neutral-600 opacity-80 hover:opacity-100 hover:scale-110 origin-center'}`}
                                        onClick={() => !a.ok && setActiveAtom(a.id)}
                                    />
                                ))}
                            </svg>
                            {activeAtom && (
                                <div className="absolute bg-black/90 backdrop-blur-md inset-0 flex flex-col items-center justify-center animate-in fade-in z-20">
                                    <span className="text-emerald-400 font-black text-2xl mb-6 uppercase tracking-widest border-b-2 border-emerald-900 pb-2">Identificação Atómica Rápida</span>
                                    <div className="flex gap-6">
                                        <button onClick={() => handleInput(1)} className="w-24 h-24 bg-white text-black font-black text-4xl rounded-2xl hover:scale-110 transition-transform shadow-[0_10px_20px_rgba(255,255,255,0.2)]">1</button>
                                        <button onClick={() => handleInput(12)} className="w-24 h-24 bg-stone-800 border-4 border-stone-600 text-white font-black text-4xl rounded-2xl hover:scale-110 transition-transform shadow-[0_10px_20px_rgba(0,0,0,0.5)]">12</button>
                                        <button onClick={() => handleInput(16)} className="w-24 h-24 bg-red-600 border-4 border-red-500 text-white font-black text-4xl rounded-2xl hover:scale-110 transition-transform shadow-[0_10px_20px_rgba(220,38,38,0.3)]">16</button>
                                    </div>
                                    <span className="text-neutral-500 text-xs mt-8">Clique na opção correta que representa a massa molar g/mol.</span>
                                </div>
                            )}
                        </div>
                        <div className={`w-full max-w-3xl transition-all duration-1000 ${isFilled ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10 pointer-events-none'}`}>
                            <div className="bg-emerald-950/20 border-2 border-emerald-600 p-8 rounded-3xl text-center shadow-[0_0_50px_rgba(16,185,129,0.2)] relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-600 to-transparent"></div>
                                <p className="text-emerald-400 font-black text-xs uppercase tracking-widest mb-1">Criptografia Orgânica Concluída</p>
                                <p className="text-white text-xl font-bold mb-6">Massa Molar do Etanol Registada: <span className="bg-black px-3 py-1 rounded text-emerald-400 border border-emerald-900 font-mono">46 g/mol</span></p>
                                <div className="bg-black/50 p-6 rounded-2xl border border-neutral-800 flex flex-col md:flex-row items-center gap-6 text-left">
                                    <p className="text-neutral-300 text-sm md:text-base flex-1">
                                        O reator exige exatamente <strong className="text-amber-400 text-lg">138 gramas</strong> desse solvente orgânico para purgar a câmara e destravar as portas. O medidor de injeção só aceita o input em MOLS. Efectue a conversão final:
                                    </p>
                                    <div className="flex flex-col items-center gap-2">
                                        <input type="text" value={ans} onChange={(e)=>setAns(e.target.value)} placeholder="0" className="w-24 bg-neutral-900 border-b-4 border-emerald-600 text-emerald-400 text-center py-3 text-4xl font-black font-mono rounded focus:outline-none focus:bg-black transition-colors" />
                                        <span className="text-neutral-500 font-bold uppercase text-xs tracking-widest">Mols</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button onClick={onComplete} disabled={!isFinalOk} className={`mt-12 px-12 md:px-24 py-6 rounded-full font-black text-xl uppercase tracking-widest transition-all duration-700 relative overflow-hidden group ${isFinalOk ? 'bg-emerald-600 border-2 border-emerald-400 text-white shadow-[0_0_60px_rgba(16,185,129,0.8)] scale-105' : 'bg-black border border-neutral-800 text-neutral-700 cursor-not-allowed'}`}>
                            {isFinalOk && <div className="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/30 to-transparent -translate-x-full group-hover:animate-[shimmer_1s_infinite]"></div>}
                            <span className="relative">Purgar Sistema e Escapar</span>
                        </button>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // COMPONENTE PRINCIPAL QUE GERENCIA TUDO
        // ============================================================================
        function EscapeRoomApp() {
            // Fases: 'boot', 'intro', 1 até 15, 'victory', 'gameover'
            const [phase, setPhase] = useState('boot'); 
            const [timeLeft, setTimeLeft] = useState(0); // Tempo decorrido (crescente)
            const [penalties, setPenalties] = useState(0);

            // Temporizador Global - Conta tempo decorrido (crescente)
            useEffect(() => {
                let timer;
                if (typeof phase === 'number') {
                    timer = setInterval(() => {
                        setTimeLeft(prev => prev + 1);
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [phase]);

            const nextPhase = () => {
                if (phase === 15) {
                    setPhase('victory');
                } else {
                    setPhase(prev => prev + 1);
                }
            };

            // 🎮 CHEAT CODE: digite "COCACOLA" para desbloquear o botão de pular fases (modo teste)
            const [cheatBuffer, setCheatBuffer] = useState('');
            const [skipUnlocked, setSkipUnlocked] = useState(false);
            
            useEffect(() => {
                const handleKey = (e) => {
                    // Ignora se estiver digitando em algum input/textarea
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                    
                    const key = e.key.toUpperCase();
                    if (key.length === 1 && /[A-Z]/.test(key)) {
                        setCheatBuffer(prev => {
                            const newBuffer = (prev + key).slice(-8); // mantém últimos 8 caracteres
                            if (newBuffer === 'COCACOLA') {
                                setSkipUnlocked(true);
                                // Feedback visual rápido
                                const flash = document.createElement('div');
                                flash.textContent = '🥤 MODO TESTE ATIVADO';
                                flash.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#10b981;color:#000;padding:20px 40px;font-weight:900;font-size:24px;border-radius:12px;z-index:9999;box-shadow:0 0 50px rgba(16,185,129,0.8);animation:fadeOut 2s forwards';
                                const style = document.createElement('style');
                                style.textContent = '@keyframes fadeOut{0%{opacity:1;scale:1}80%{opacity:1;scale:1}100%{opacity:0;scale:0.8}}';
                                document.head.appendChild(style);
                                document.body.appendChild(flash);
                                setTimeout(() => flash.remove(), 2000);
                                return '';
                            }
                            return newBuffer;
                        });
                    }
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, []);

            const restart = () => {
                setPhase('boot');
                setTimeLeft(0);
                setPenalties(0);
            };

            const renderPhase = () => {
                switch(phase) {
                    case 'boot': return <ScreenBoot onComplete={() => setPhase('intro')} />;
                    case 'intro': return <ScreenIntro onStart={() => setPhase(1)} />;
                    case 'victory': return <ScreenVictory timeLeft={timeLeft} penalties={penalties} onRestart={restart} />;
                    case 'gameover': return <ScreenGameOver onRestart={restart} />;
                    case 1: return <Module1 onComplete={nextPhase} />;
                    case 2: return <Module2 onComplete={nextPhase} />;
                    case 3: return <Module3 onComplete={nextPhase} />;
                    case 4: return <Module4 onComplete={nextPhase} />;
                    case 5: return <Module5 onComplete={nextPhase} />;
                    case 6: return <Module6 onComplete={nextPhase} />;
                    case 7: return <Module7 onComplete={nextPhase} />;
                    case 8: return <Module8 onComplete={nextPhase} />;
                    case 9: return <Module9 onComplete={nextPhase} />;
                    case 10: return <Module10 onComplete={nextPhase} />;
                    case 11: return <Module11 onComplete={nextPhase} />;
                    case 12: return <Module12 onComplete={nextPhase} />;
                    case 13: return <Module13 onComplete={nextPhase} />;
                    case 14: return <Module14 onComplete={nextPhase} />;
                    case 15: return <Module15 onComplete={nextPhase} />;
                    default: return <ScreenBoot onComplete={() => setPhase('intro')} />;
                }
            };

            return (
                <div className="min-h-screen bg-[#0a0a0a] text-neutral-200 selection:bg-emerald-500/30 overflow-x-hidden flex flex-col">
                    {/* Header Topo - Só aparece nas fases de jogo */}
                    {typeof phase === 'number' && (
                        <header className="w-full bg-black/80 backdrop-blur border-b border-neutral-800 p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
                            <div className="flex items-center gap-3">
                                <span className="text-emerald-500"><Icons.Shield /></span>
                                <span className="font-black text-emerald-500 tracking-widest uppercase hidden md:inline">Avogadro Reator</span>
                                <span className="text-neutral-500 font-mono text-sm border-l border-neutral-700 pl-3 ml-1 hidden sm:inline">Setor {phase}/15</span>
                            </div>
                            <div className="flex items-center gap-3">
                                {skipUnlocked && (
                                    <button 
                                        onClick={nextPhase}
                                        title="Modo Teste: Pular Fase"
                                        className="flex items-center gap-2 px-4 py-2 rounded-full font-mono font-black text-sm border bg-fuchsia-950/50 border-fuchsia-500 text-fuchsia-300 hover:bg-fuchsia-900 transition-colors uppercase tracking-widest shadow-[0_0_15px_rgba(217,70,239,0.4)]"
                                    >
                                        🥤 Pular ▶
                                    </button>
                                )}
                                <div className="flex items-center gap-2 px-4 py-2 rounded-full font-mono font-black text-xl border bg-neutral-900 border-neutral-700 text-emerald-400">
                                    <Icons.Clock />
                                    {formatTime(timeLeft)}
                                </div>
                            </div>
                        </header>
                    )}
                    
                    {/* Renderizador de Fases */}
                    <main className="flex-1 container mx-auto p-4 md:p-8 flex flex-col items-center justify-center">
                        <div className="w-full max-w-5xl h-full min-h-[75vh]">
                            {renderPhase()}
                        </div>
                    </main>
                </div>
            );
        }

        // ============================================================================
        // INICIALIZAÇÃO DO REACT
        // ============================================================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EscapeRoomApp />);
    </script>
</body>
</html>
